services:
  - type: web
    name: tiktok-temple-live
    env: node
    plan: free
    buildCommand: bun install && python3 -m venv .venv && .venv/bin/pip install zerotts pillow
    startCommand: bun start
    envVars:
      - key: PORT
        value: 3000
      - key: POETRY_VERSION
        value: "none"
